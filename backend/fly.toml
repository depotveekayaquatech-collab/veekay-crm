# Fly.io config for the API. First time: `fly launch --no-deploy --copy-config` from this folder
# (change `app` to a unique name), then follow DEPLOY_FLY_VERCEL.md.
app = "veekay-crm-api"
primary_region = "sin"         

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  DOCS_ENABLED = "false"
  LOG_JSON = "true"
  TRUST_PROXY_HEADERS = "true"
  STORAGE_BACKEND = "s3"
  WEB_CONCURRENCY = "2"
DB_POOL_SIZE = "5"
DB_MAX_OVERFLOW = "5"
  DASHBOARD_CACHE_SECONDS = "30"
  # "Forgot password" emails go out from the company mailbox. The App Password is a Fly SECRET (SMTP_PASSWORD), never written here.
  SMTP_HOST = "smtp.gmail.com"
  SMTP_PORT = "587"
  SMTP_USER = "depot.veekayaquatech@gmail.com"
  SMTP_FROM = "Veekay Aquatech <depot.veekayaquatech@gmail.com>"

[deploy]
  release_command = "sh -c 'alembic upgrade head && python scripts/seed.py'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # the daily sheet-sync scheduler lives in the process (a DB lock keeps it to one run)
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-2x"         # 2 cores for the 2 workers; PDF / photo work needs the 1 GB
  memory = "1024mb"
