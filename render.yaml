# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates three resources from this repo:
#   * veekay-db   — managed PostgreSQL
#   * veekay-api  — FastAPI service (runs migrations + seed on every deploy)
#   * veekay-web  — the Vite static site
#
# First deploy: New > Blueprint in the Render dashboard, pick this repo.
# Two values are intentionally left blank (sync: false) because they
# reference URLs that don't exist until the services are created — set
# them in the dashboard after the first deploy, then redeploy. See DEPLOY.md.

databases:
  - name: veekay-db
    plan: free
    databaseName: veekay_crm
    user: veekay

services:
  - type: web
    name: veekay-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      alembic upgrade head &&
      python scripts/seed.py &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health   # liveness only; point your uptime monitor at /api/v1/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: veekay-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # After first deploy set this to: ["https://veekay-web.onrender.com"]
      # (use the real veekay-web URL Render assigns).
      - key: CORS_ORIGINS
        sync: false
      # The web app's public URL — printed into the QR code on every vendor card
      # (e.g. https://veekay-web.onrender.com). Cards printed before it is set
      # would point at localhost, so set it before generating cards.
      - key: PUBLIC_APP_URL
        sync: false
      # Render sits behind a proxy: trust X-Forwarded-For so the login throttle sees real client IPs.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # FIRST DEPLOY ONLY: the password for the initial ADMIN001 account (they must change it at first
      # sign-in). Production never creates demo users. Remove the value once you have signed in.
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Shown on the vendor-card header (optional).
      - key: COMPANY_EMAIL
        sync: false
      # Where compliance cards / bills are stored. Render's free disk is wiped on
      # every deploy: attach a persistent disk (paid plan) mounted at /var/data and
      # set UPLOAD_DIR=/var/data/uploads, or these files will disappear.
      - key: UPLOAD_DIR
        value: storage
      # Strongly recommended: keep uploads in S3-compatible object storage (AWS S3, Cloudflare R2, Backblaze B2...).
      # Set STORAGE_BACKEND=s3 plus the S3_* values, then run scripts/migrate_storage.py once. See DEPLOY.md.
      - key: STORAGE_BACKEND
        value: local
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Secret for tickets pushed in from a Google Apps Script (see docs/GOOGLE_SCRIPT_TICKETS.md). Empty = switched off.
      - key: TICKET_WEBHOOK_KEY
        sync: false
      # Error tracking (optional): a Sentry DSN turns it on. RELEASE is shown on each event.
      - key: SENTRY_DSN
        sync: false
      - key: LOG_JSON
        value: "true"
      - key: DOCS_ENABLED
        value: "false"

  - type: web
    name: veekay-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # After first deploy set this to: https://veekay-api.onrender.com/api/v1
      # (use the real veekay-api URL Render assigns).
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
