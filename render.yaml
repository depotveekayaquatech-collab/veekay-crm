# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates three resources from this repo:
#   * veekay-db   — managed PostgreSQL
#   * veekay-api  — FastAPI service (runs migrations + seed on every deploy)
#   * veekay-web  — the Vite static site
#
# First deploy: New > Blueprint in the Render dashboard, pick this repo.
# Two values are intentionally left blank (sync: false) because they
# reference URLs that don't exist until the services are created — set
# them in the dashboard after the first deploy, then redeploy. See DEPLOY.md.

databases:
  - name: veekay-db
    plan: free
    databaseName: veekay_crm
    user: veekay

services:
  - type: web
    name: veekay-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      alembic upgrade head &&
      python scripts/seed.py &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: veekay-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # After first deploy set this to: ["https://veekay-web.onrender.com"]
      # (use the real veekay-web URL Render assigns).
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: veekay-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # After first deploy set this to: https://veekay-api.onrender.com/api/v1
      # (use the real veekay-api URL Render assigns).
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
